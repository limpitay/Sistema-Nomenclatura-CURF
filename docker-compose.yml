version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sistema-nomenclatura-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nomenclatura_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - sistema-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sistema-nomenclatura-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sistema-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sistema-nomenclatura-api
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: nomenclatura_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - sistema-network
    command: npm start

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sistema-nomenclatura-frontend
    ports:
      - "8080:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - sistema-network
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - sistema-network

  # CONTENEDOR DE DESARROLLO - Solo para ejecutar comandos
  dev:
    image: node:18-slim
    container_name: sistema-nomenclatura-dev
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./frontend:/app-frontend
    command: tail -f /dev/null
    networks:
      - sistema-network
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data:

networks:
  sistema-network:
    driver: bridge